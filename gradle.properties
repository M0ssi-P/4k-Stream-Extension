org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# the app provides the Kotlin stdlib at runtime: plugins compile against it, never bundle it
kotlin.stdlib.default.dependency=false

# The plugin API. Locally: publish it from the app repo with `gradlew :extension-api:publishToMavenLocal`.
# On GitHub Actions: set the repository variable FOURK_API to the JitPack coordinate, e.g.
#   com.github.<you>.<app-repo>:extension-api:<tag>
fourkApi=fourk:extension-api:1.0.0
kotlinVersion=2.2.20

# shown in the app
repoName=4k Stream Plugins
repoAuthor=4k Stream
