org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# the app provides the Kotlin stdlib at runtime: plugins compile against it, never bundle it
kotlin.stdlib.default.dependency=false

# The plugin API, built by JitPack from the app repo's tag (one module, so JitPack names it after the repo).
# New API version: tag the app repo and change the version here. The FOURK_API repository variable overrides this on CI.
fourkApi=com.github.M0ssi-P:4k-Stream:1.0.0
kotlinVersion=2.2.20

# shown in the app
repoName=4k Stream Plugins
repoAuthor=4k Stream
